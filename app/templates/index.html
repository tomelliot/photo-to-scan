<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Paperless Feeder</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <style>
        html, body { height: 100%; overflow: hidden; }
        [x-cloak] { display: none !important; }
        /* shadcn-inspired popover */
        .label-popover {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            z-index: 60;
            width: 18rem;
            max-height: 22rem;
            display: flex;
            flex-direction: column;
            background: white;
            border: 1px solid rgb(229, 231, 235);
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .label-popover__search {
            padding: 0.5rem;
            border-bottom: 1px solid rgb(229, 231, 235);
        }
        .label-popover__search input {
            width: 100%;
            padding: 0.4rem 0.6rem;
            font-size: 0.875rem;
            border: 1px solid rgb(229, 231, 235);
            border-radius: 0.375rem;
            outline: none;
        }
        .label-popover__search input:focus {
            border-color: rgb(59, 130, 246);
            box-shadow: 0 0 0 1px rgb(59, 130, 246);
        }
        .label-popover__list {
            overflow-y: auto;
            padding: 0.25rem;
            flex: 1;
        }
        .label-popover__item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.5rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            color: rgb(55, 65, 81);
        }
        .label-popover__item:hover {
            background: rgb(243, 244, 246);
        }
        .label-popover__item[aria-selected="true"] {
            background: rgb(239, 246, 255);
            color: rgb(30, 64, 175);
        }
        .label-popover__check {
            width: 1rem;
            height: 1rem;
            opacity: 0;
        }
        .label-popover__item[aria-selected="true"] .label-popover__check {
            opacity: 1;
        }
        .label-popover__empty {
            padding: 0.75rem;
            font-size: 0.875rem;
            color: rgb(107, 114, 128);
            text-align: center;
        }
        .label-selector-btn {
            position: relative;
        }
        .label-selector-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            background: rgb(42, 83, 35);
            color: white;
            font-size: 11px;
            line-height: 18px;
            text-align: center;
            font-weight: 600;
        }
        /* When content doesn't overflow, center it; when it does, scroll naturally */
        #page-list {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            min-width: 100%;
            justify-content: center;
            height: 100%;
        }
        .page-thumb { margin-bottom: 0.75rem; }
        .delete-btn { color: rgb(220, 53, 69); background: transparent; }
        .delete-btn:hover { color: white; background: rgb(220, 53, 69); }
        /* Once content overflows, switch to start-aligned so scroll works properly */
        #page-list.has-pages {
            justify-content: start;
            min-width: auto;
        }
    </style>
    <script>
        function scrollToLastPage() {
            var list = document.getElementById('page-list');
            var addBtn = list.querySelector('.add-btn');
            if (addBtn) {
                addBtn.scrollIntoView({ behavior: 'smooth', inline: 'center' });
            }
        }

        function updateListState() {
            var list = document.getElementById('page-list');
            var hasPages = list.querySelector('.page-thumb') !== null;
            list.classList.toggle('has-pages', hasPages);

            // Update processing count on Alpine root
            var body = document.querySelector('[x-data]');
            if (body && body._x_dataStack) {
                var data = body._x_dataStack[0];
                data.processing = list.querySelectorAll('.page-thumb[hx-post]').length;
            }
        }

        function openLightbox(src) {
            var lb = document.getElementById('lightbox');
            lb.querySelector('img').src = src;
            lb.classList.remove('hidden');
        }
        function closeLightbox() {
            var lb = document.getElementById('lightbox');
            lb.classList.add('hidden');
            lb.querySelector('img').src = '';
        }

        document.addEventListener('htmx:afterSettle', function(e) {
            var elt = e.detail.elt;
            updateListState();

            // After upload (beforebegin swap on .add-btn), scroll to the new thumb
            if (elt && elt.classList && elt.classList.contains('add-btn')) {
                scrollToLastPage();
            }

            // After /process completes (outerHTML swap on page-*), wait for image load then scroll
            if (elt && elt.id && elt.id.startsWith('page-')) {
                var img = elt.querySelector('img');
                if (img) {
                    var doScroll = function() { scrollToLastPage(); };
                    if (img.complete) {
                        doScroll();
                    } else {
                        img.addEventListener('load', doScroll, { once: true });
                    }
                }
            }
        });
    </script>
</head>
<body class="h-full bg-gray-100 flex flex-col"
      x-data="{
          uploading: false,
          submitting: false,
          processing: 0,
          tagsLoaded: false,
          tagsError: false,
          tags: [],
          selectedTags: [],
          labelOpen: false,
          labelSearch: '',
          loadTags() {
              fetch('/tags')
                  .then(r => { if (!r.ok) throw new Error('tags ' + r.status); return r.json(); })
                  .then(data => { this.tags = data; this.tagsLoaded = true; this.$nextTick(() => window.lucide && window.lucide.createIcons()); })
                  .catch(() => { this.tagsError = true; });
          },
          toggleTag(id) {
              const i = this.selectedTags.indexOf(id);
              if (i === -1) this.selectedTags.push(id); else this.selectedTags.splice(i, 1);
          },
          filteredTags() {
              const q = this.labelSearch.trim().toLowerCase();
              if (!q) return this.tags;
              return this.tags.filter(t => t.name.toLowerCase().includes(q));
          },
          tagsParam() {
              return JSON.stringify({ tags: this.selectedTags });
          }
      }"
      x-init="loadTags(); $nextTick(() => window.lucide && window.lucide.createIcons())">

    <!-- Scrollable content area -->
    <div class="flex-1 overflow-y-auto p-4 pb-2 relative">
        <!-- Background heading — sits behind documents -->
        <h1 class="absolute top-4 left-0 right-0 text-center text-4xl font-bold text-gray-300 pointer-events-none select-none z-0">
            Paperless Feeder
        </h1>
        <div id="page-list" class="gap-3 overflow-x-auto relative z-10"
             x-init="new Sortable($el, {
                 animation: 150,
                 ghostClass: 'opacity-30',
                 filter: '.add-btn',
                 onEnd(evt) {
                     const ids = [...evt.to.children]
                         .filter(el => el.id.startsWith('page-'))
                         .map(el => el.id.replace('page-', ''));
                     fetch('/pages/reorder', {
                         method: 'PUT',
                         headers: {'Content-Type': 'application/json'},
                         body: JSON.stringify({order: ids})
                     });
                 }
             })">

            <!-- Restore existing session pages on load -->
            <div hx-get="/pages" hx-trigger="load" hx-target="#page-list .add-btn"
                 hx-swap="beforebegin" style="display:none"></div>

            <!-- Add page button -->
            <label class="add-btn flex-shrink-0 w-24 h-24 flex items-center justify-center
                          bg-white border-2 border-dashed border-gray-300 rounded-lg cursor-pointer
                          hover:border-blue-400 hover:bg-blue-50 transition-colors"
                   :class="{ 'opacity-50 pointer-events-none': uploading || submitting }">
                <svg x-show="!uploading" class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <svg x-show="uploading" class="animate-spin w-8 h-8 text-blue-500" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                <input type="file" accept="image/*" capture="environment" class="hidden"
                       hx-post="/upload" hx-target="#page-list .add-btn" hx-swap="beforebegin"
                       hx-encoding="multipart/form-data" name="file"
                       @htmx:before-request="uploading = true"
                       @htmx:after-request="uploading = false; $el.value = ''">
            </label>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"
         onclick="closeLightbox()">
        <img src="" alt="preview" class="max-w-full max-h-full rounded-lg">
    </div>

    <!-- Error modal container (populated via OOB swap) -->
    <div id="error-modal"></div>

    <!-- Submit row — fixed at bottom: [label selector] [upload document] -->
    <div class="flex-shrink-0 p-4 pt-2 bg-gray-100 flex items-stretch gap-2 relative">

        <!-- Label selector button (icon-only) -->
        <div class="relative" @click.outside="labelOpen = false">
            <button id="label-selector-btn" type="button"
                    class="label-selector-btn h-12 w-12 flex items-center justify-center rounded-lg bg-white border border-gray-300 text-gray-700"
                    :class="{ 'opacity-50 pointer-events-none': !tagsLoaded || submitting || uploading }"
                    :disabled="!tagsLoaded || submitting || uploading"
                    :title="tagsLoaded ? 'Add labels' : (tagsError ? 'Could not load labels' : 'Loading labels…')"
                    @click="labelOpen = !labelOpen; $nextTick(() => { if (labelOpen) document.getElementById('label-search').focus(); })">
                <i data-lucide="tags" class="w-5 h-5"></i>
                <span class="badge" x-show="selectedTags.length > 0" x-text="selectedTags.length"></span>
            </button>

            <!-- Popover -->
            <div id="label-popover" class="label-popover" x-show="labelOpen" x-cloak
                 @keydown.escape.window="labelOpen = false">
                <div class="label-popover__search">
                    <input id="label-search" type="text" placeholder="Search labels…"
                           x-model="labelSearch"
                           autocomplete="off">
                </div>
                <div class="label-popover__list">
                    <template x-for="tag in filteredTags()" :key="tag.id">
                        <div class="label-popover__item"
                             :aria-selected="selectedTags.includes(tag.id) ? 'true' : 'false'"
                             @click="toggleTag(tag.id)">
                            <svg class="label-popover__check" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                            </svg>
                            <span x-text="tag.name"></span>
                        </div>
                    </template>
                    <div class="label-popover__empty" x-show="filteredTags().length === 0">
                        <span x-show="!tagsError">No labels found.</span>
                        <span x-show="tagsError">Could not load labels.</span>
                    </div>
                </div>
            </div>
        </div>

        <button id="submit-btn" hx-post="/submit" hx-swap="none"
                :hx-vals="tagsParam()"
                class="flex-1 text-white py-3 rounded-lg font-medium" style="background-color: #2A5323;"
                :class="{ 'opacity-50 pointer-events-none': submitting || uploading || processing > 0 }"
                :disabled="submitting || uploading || processing > 0"
                @htmx:before-request="submitting = true"
                @htmx:after-request="submitting = false; selectedTags = []; updateListState()">
            <span x-show="!submitting && processing === 0">Upload document</span>
            <span x-show="!submitting && processing > 0" class="flex items-center justify-center gap-2">
                <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                Processing&hellip;
            </span>
            <span x-show="submitting" class="flex items-center justify-center gap-2">
                <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                Submitting&hellip;
            </span>
        </button>
    </div>
</body>
</html>
